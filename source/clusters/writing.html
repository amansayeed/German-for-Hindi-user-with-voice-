        var CATEGORIES = [
            { id: 'Alphabet', label: '🔤 Alphabet (A–Z, Ä, Ö, Ü, ß)' },
            { id: 'Clusters', label: '🔗 Character Clusters' },
            { id: 'all', label: 'All (Alphabet + Clusters)' }
        ];

        var wordsByCategory = { Alphabet: [], Clusters: CLUSTERS, all: [] };
        /** Current position in order for each category (all in order, not random). */
        var currentIndexByCategory = { Alphabet: 0, Clusters: 0, all: 0 };

        var currentWord = '';
        var currentEntry = null;
        var currentCategoryId = 'Alphabet';
        var currentFocusedBoxIndex = 1;
        var audioCtx = null;

        function getCurrentWordList() {
            return wordsByCategory[currentCategoryId] || [];
        }

        /** Next item in order for current category (all categories in order). */
        function getNextEntry() {
            var list = getCurrentWordList();
            if (!list.length) return null;
            var idx = currentIndexByCategory[currentCategoryId];
            var entry = list[idx];
            currentIndexByCategory[currentCategoryId] = (idx + 1) % list.length;
            return entry;
        }

        /** Previous item in order (one step back, wraps to end). */
        function getPreviousEntry() {
            var list = getCurrentWordList();
            if (!list.length) return null;
            var len = list.length;
            var idx = currentIndexByCategory[currentCategoryId];  /* next index to show */
            var prevIdx = (idx - 2 + len) % len;                  /* item before current */
            currentIndexByCategory[currentCategoryId] = (idx - 1 + len) % len;
            return list[prevIdx];
        }

        /** For clusters: different word per input box (1–10) from entry.words; for alphabet: speak letter. */
        function getWordToSpeak(entry, inputBoxIndex) {
            if (!entry) return currentWord;
            if (entry.words && entry.words.length && inputBoxIndex != null) {
                var i = (inputBoxIndex - 1) % entry.words.length;
                return entry.words[i];
            }
            if (entry.words && entry.words.length) return entry.words[0];
            var en = (entry.en || '').trim();
            var paren = en.indexOf(' (');
            if (paren > 0) return en.substring(0, paren).trim();
            if (en && en.indexOf(' ') === -1) return en;
            return entry.de;
        }

        function speakGerman(text) {
            if (!text || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'de-DE';
            u.rate = 0.9;
            var voices = window.speechSynthesis.getVoices();
            var de = voices.find(function(v) { return v.lang.startsWith('de'); });
            if (de) u.voice = de;
            window.speechSynthesis.speak(u);
        }

        function playWrongBuzz() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 180;
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        function checkInput(inputEl, index) {
            var val = (inputEl.value || '').trim();
            inputEl.classList.remove('correct', 'wrong');
            if (val === '') return;
            var isLast = parseInt(inputEl.dataset.index, 10) === 10;
            if (val === currentWord) {
                inputEl.classList.add('correct');
                speakGerman(getWordToSpeak(currentEntry, parseInt(inputEl.dataset.index, 10)));
                if (isLast) {
                    setTimeout(setNewWord, 900);
                }
            } else {
                inputEl.classList.add('wrong');
                playWrongBuzz();
            }
        }

        function buildInputs() {
            var container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            for (var i = 1; i <= 10; i++) {
                var cell = document.createElement('div');
                cell.className = 'input-cell';
                var label = document.createElement('label');
                label.textContent = i + '.';
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'writing-input';
                input.autocomplete = 'off';
                input.placeholder = '…';
                input.dataset.index = i;
                input.addEventListener('focus', function() { updateWordForBox(parseInt(this.dataset.index, 10)); });
                input.addEventListener('blur', function() { checkInput(this, parseInt(this.dataset.index, 10)); });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkInput(this, parseInt(this.dataset.index, 10));
                        var inputs = container.querySelectorAll('.writing-input');
                        var idx = parseInt(this.dataset.index, 10);
                        if (idx < 10 && inputs[idx]) inputs[idx].focus();
                    }
                });
                cell.appendChild(label);
                cell.appendChild(input);
                container.appendChild(cell);
            }
        }

        function setNewWord() {
            var entry = getNextEntry();
            showEntry(entry);
        }

        function setPreviousWord() {
            var entry = getPreviousEntry();
            showEntry(entry);
        }

        function updateWordForBox(boxIndex) {
            var el = document.getElementById('wordForBox');
            if (!el) return;
            currentFocusedBoxIndex = boxIndex;
            var word = getWordToSpeak(currentEntry, boxIndex);
            el.textContent = word || '';
        }

        function showEntry(entry) {
            if (!entry) {
                document.getElementById('wordDisplay').textContent = '—';
                document.getElementById('wordEn').textContent = '';
                document.getElementById('wordHi').textContent = '';
                document.getElementById('wordForBox').textContent = '';
                buildInputs();
                return;
            }
            currentEntry = entry;
            currentWord = entry.de;
            document.getElementById('wordDisplay').textContent = currentWord;
            document.getElementById('wordEn').textContent = entry.en;
            document.getElementById('wordHi').textContent = entry.hi;
            buildInputs();
            updateWordForBox(1);
        }

        function fillCategorySelect() {
            var sel = document.getElementById('categorySelect');
            if (!sel) return;
            sel.removeEventListener('change', categorySelectListener);
            sel.innerHTML = '';
            CATEGORIES.forEach(function(c) {
                var arr = wordsByCategory[c.id];
                var count = Array.isArray(arr) ? arr.length : 0;
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.label + ' (' + count + ')';
                sel.appendChild(opt);
            });
            sel.addEventListener('change', categorySelectListener);
        }

        var categorySelectListener = function() {
            currentCategoryId = this.value;
            currentIndexByCategory[currentCategoryId] = 0;
            setNewWord();
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        document.getElementById('hearBtn').addEventListener('click', function() { speakGerman(getWordToSpeak(currentEntry, null)); });
        document.getElementById('prevBtn').addEventListener('click', setPreviousWord);
        document.getElementById('nextBtn').addEventListener('click', setNewWord);
        document.getElementById('wordForBox').addEventListener('click', function() {
            var w = getWordToSpeak(currentEntry, currentFocusedBoxIndex);
            if (w) speakGerman(w);
        });

        function applyAlphabet(data) {
            ALPHABET = Array.isArray(data) ? data : FALLBACK_ALPHABET;
            wordsByCategory.Alphabet = ALPHABET;
            wordsByCategory.all = ALPHABET.concat(CLUSTERS);
            fillCategorySelect();
            currentCategoryId = 'Alphabet';
            currentIndexByCategory.Alphabet = 0;
            currentIndexByCategory.Clusters = 0;
            currentIndexByCategory.all = 0;
            setNewWord();
        }

        fetch('alphabet-data.json')
            .then(function(r) { return r.json(); })
            .then(applyAlphabet)
            .catch(function() { applyAlphabet(FALLBACK_ALPHABET); });
    </script>
    <script src="../../js/theme.js"></script>
</body>
</html>
