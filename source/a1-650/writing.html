    <style>
        :root {
            --bg-main: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #333;
            --text-secondary: #666;
            --border-color: #ddd;
            --accent: #1565c0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 20px;
            margin-left: 280px;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            transition: margin-left 0.3s ease;
        }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%); box-shadow: 4px 0 12px rgba(0,0,0,0.3); z-index: 1000; overflow-y: auto; transition: transform 0.3s ease; }
        .sidebar-header { padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; }
        .sidebar-header h2 { margin: 0; font-size: 1.3em; }
        .sidebar-nav { padding: 10px 0; }
        .sidebar-nav-item { display: block; padding: 14px 20px; color: #e2e8f0; text-decoration: none; border-left: 4px solid transparent; font-size: 15px; }
        .sidebar-nav-item:hover { background: rgba(102, 126, 234, 0.2); border-left-color: #667eea; color: #fff; }
        .sidebar-nav-item.active { background: linear-gradient(90deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%); border-left-color: #667eea; font-weight: 700; }
        .sidebar-nav-item .emoji { margin-right: 10px; font-size: 1.2em; }
        .sidebar-toggle { display: none; position: fixed; top: 15px; left: 15px; z-index: 1001; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 20px; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .theme-toggle-wrap { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.15); margin-top: 8px; }
        .theme-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; color: #e2e8f0; font-size: 14px; cursor: pointer; }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }
        @media screen and (max-width: 768px) { body { margin: 10px; margin-left: 10px; padding-top: 60px; } .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .sidebar-toggle { display: block; } }
        @media print { body { margin: 0; } .sidebar, .sidebar-toggle, .sidebar-overlay { display: none; } }

        h1 { text-align: center; color: var(--accent); margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 24px; font-size: 16px; }

        .writing-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 28px 30px;
            margin-bottom: 0;
            width: 100%;
            max-width: 100%;
            min-height: calc(100vh - 180px);
            box-sizing: border-box;
        }
        @media screen and (max-width: 400px) {
            .inputs-grid { grid-template-columns: 1fr; }
        }
        body.theme-dark .writing-card { background: var(--bg-card); box-shadow: 0 2px 12px rgba(0,0,0,0.3); }

        .category-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .category-row label {
            font-weight: 600;
            color: var(--text-primary);
        }
        .category-select {
            min-width: 220px;
            padding: 10px 14px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
        }
        .category-select:focus { outline: none; border-color: var(--accent); }
        body.theme-dark .category-select { background: var(--bg-card-alt); border-color: var(--border-color); }

        .word-top {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--border-color);
        }
        body.theme-dark .word-top { border-bottom-color: var(--border-color); }
        .word-display {
            font-size: 2em;
            font-weight: 800;
            color: #0d47a1;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        body.theme-dark .word-display { color: var(--german-color, #93c5fd); }
        .word-meanings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 1.05em;
        }
        .word-en { color: #1b5e20; font-weight: 600; }
        body.theme-dark .word-en { color: var(--english-color, #86efac); }
        .word-hi { color: #4a148c; font-weight: 600; }
        body.theme-dark .word-hi { color: var(--hindi-color, #c4b5fd); }
        .word-sep { color: var(--text-secondary); font-weight: 400; }
        .word-hint { text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
        .word-for-box {
            text-align: center;
            margin-top: 12px;
            font-size: 1.15em;
            font-weight: 600;
            color: #0d47a1;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .word-for-box:hover { text-decoration: underline; opacity: 0.9; }
        body.theme-dark .word-for-box { color: var(--german-color, #93c5fd); }
        .hear-next-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }
        .hear-btn, .hear-next-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .hear-btn:hover, .hear-next-btn:hover { opacity: 0.9; }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .input-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-cell label { min-width: 22px; font-weight: 600; color: var(--text-secondary); font-size: 14px; }
        .writing-input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            font-size: 17px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .writing-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .writing-input.correct {
            border-color: #2e7d32;
            background-color: rgba(46, 125, 50, 0.08);
        }
        body.theme-dark .writing-input.correct { border-color: #66bb6a; background-color: rgba(102, 187, 106, 0.15); }
        .writing-input.wrong {
            border-color: #c62828;
            background-color: rgba(198, 40, 40, 0.08);
            animation: shake 0.4s ease;
        }
        body.theme-dark .writing-input.wrong { border-color: #ef5350; background-color: rgba(239, 83, 80, 0.15); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .new-word-btn {
            display: block;
            margin: 28px auto 0;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .new-word-btn:hover { opacity: 0.9; }
    </style>

        document.addEventListener('click', function(e) {
            var link = e.target.closest('a');
            if (link) {
                var href = link.getAttribute('href');
                if (href && href.endsWith('.html') && !href.startsWith('http') && !href.startsWith('#')) {
                    e.preventDefault();
                    try {
                        window.location.href = new URL(href, window.location.href).href;
                    } catch(err) {
                        window.location.href = window.location.href.replace(/[^/]+$/, '') + href;
                    }
                }
            }
        });
    </script>

    <script src="writing-data.js"></script>
    <script>
        var CATEGORIES = [
            { id: 'Greetings_&_Basics', label: '👋 Greetings & Basics' },
            { id: 'Colors', label: '🎨 Colors' },
            { id: 'Family_&_People', label: '👨‍👩‍👧 Family & People' },
            { id: 'Body_Parts', label: '🧍 Body Parts' },
            { id: 'Health_&_Feelings', label: '🏥 Health & Feelings' },
            { id: 'Food', label: '🍎 Food' },
            { id: 'Drinks', label: '🥤 Drinks' },
            { id: 'House_&_Furniture', label: '🏠 House & Furniture' },
            { id: 'Kitchen_Items', label: '🍽️ Kitchen Items' },
            { id: 'Clothing', label: '👕 Clothing' },
            { id: 'Transport_&_Travel', label: '🚗 Transport & Travel' },
            { id: 'Places_&_City', label: '🏙️ Places & City' },
            { id: 'Nature_&_Weather', label: '🌳 Nature & Weather' },
            { id: 'Time', label: '⏰ Time' },
            { id: 'School_&_Learning', label: '📚 School & Learning' },
            { id: 'Work_&_Job', label: '💼 Work & Job' },
            { id: 'Shopping_&_Money', label: '🛒 Shopping & Money' },
            { id: 'Communication', label: '📱 Communication' },
            { id: 'Animals', label: '🐾 Animals' },
            { id: 'Celebrations', label: '🎉 Celebrations' },
            { id: 'Personal_Items', label: '🎒 Personal Items' },
            { id: 'Question_Words', label: '❓ Question Words' },
            { id: 'Pronouns', label: '👤 Pronouns' },
            { id: 'Verbs_(Actions)', label: '🏃 Verbs' },
            { id: 'Adjectives', label: '✨ Adjectives' },
            { id: 'Adverbs_&_Other', label: '🔗 Adverbs & Connectors' }
        ];

        var FALLBACK_WORDS = {
            'Greetings_&_Basics': [
                { de: 'Hallo', en: 'Hello', hi: 'हैलो' }, { de: 'Danke', en: 'Thanks', hi: 'धन्यवाद' },
                { de: 'Bitte', en: 'Please', hi: 'कृपया' }, { de: 'Ja', en: 'Yes', hi: 'हाँ' },
                { de: 'Nein', en: 'No', hi: 'नहीं' }, { de: 'Guten Morgen', en: 'Good morning', hi: 'सुप्रभात' },
                { de: 'Guten Tag', en: 'Good day', hi: 'नमस्कार' }, { de: 'Tschüss', en: 'Bye', hi: 'बाय' }
            ]
        };

        var wordsByCategory = {};
        var currentWord = '';
        var currentEntry = null;
        var currentCategoryId = '';
        var audioCtx = null;
        /** Current index per category for serial order (no random). */
        var currentIndexByCategory = {};

        function getCurrentWordList() {
            if (currentCategoryId === '' || currentCategoryId === 'all') {
                var all = [];
                CATEGORIES.forEach(function(c) {
                    var arr = wordsByCategory[c.id];
                    if (Array.isArray(arr)) arr.forEach(function(w) { all.push(w); });
                });
                return all;
            }
            return wordsByCategory[currentCategoryId] || [];
        }

        /** Next word in serial order (wraps to start). */
        function getNextEntry() {
            var list = getCurrentWordList();
            if (!list.length) return null;
            var idx = currentIndexByCategory[currentCategoryId] || 0;
            var entry = list[idx];
            currentIndexByCategory[currentCategoryId] = (idx + 1) % list.length;
            return entry;
        }

        /** Previous word in serial order (wraps to end). */
        function getPreviousEntry() {
            var list = getCurrentWordList();
            if (!list.length) return null;
            var len = list.length;
            var idx = currentIndexByCategory[currentCategoryId] !== undefined ? currentIndexByCategory[currentCategoryId] : 0;
            var prevIdx = (idx - 2 + len) % len;
            currentIndexByCategory[currentCategoryId] = (idx - 1 + len) % len;
            return list[prevIdx];
        }

        function speakGerman(text) {
            if (!text || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'de-DE';
            u.rate = 0.9;
            var voices = window.speechSynthesis.getVoices();
            var de = voices.find(function(v) { return v.lang.startsWith('de'); });
            if (de) u.voice = de;
            window.speechSynthesis.speak(u);
        }

        function playWrongBuzz() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 180;
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        function checkInput(inputEl, index) {
            var val = (inputEl.value || '').trim();
            inputEl.classList.remove('correct', 'wrong');
            if (val === '') return;
            var isLast = parseInt(inputEl.dataset.index, 10) === 10;
            if (val === currentWord) {
                inputEl.classList.add('correct');
                speakGerman(currentWord);
                if (isLast) {
                    setTimeout(setNewWord, 900);
                }
            } else {
                inputEl.classList.add('wrong');
                playWrongBuzz();
            }
        }

        function updateWordForBox(boxIndex) {
            var el = document.getElementById('wordForBox');
            if (!el || !currentEntry) { if (el) el.textContent = ''; return; }
            var de = currentWord;
            var en = currentEntry.en || '';
            var hi = currentEntry.hi || '';
            el.textContent = (de ? de + (en || hi ? ' — ' : '') : '') + (en ? en + (hi ? ' — ' : '') : '') + (hi || '');
        }

        function buildInputs() {
            var container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            for (var i = 1; i <= 10; i++) {
                var cell = document.createElement('div');
                cell.className = 'input-cell';
                var label = document.createElement('label');
                label.textContent = i + '.';
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'writing-input';
                input.autocomplete = 'off';
                input.placeholder = '…';
                input.dataset.index = i;
                input.addEventListener('focus', function() { updateWordForBox(parseInt(this.dataset.index, 10)); });
                input.addEventListener('blur', function() { checkInput(this, parseInt(this.dataset.index, 10)); });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkInput(this, parseInt(this.dataset.index, 10));
                        var inputs = container.querySelectorAll('.writing-input');
                        var idx = parseInt(this.dataset.index, 10);
                        if (idx < 10 && inputs[idx]) inputs[idx].focus();
                    }
                });
                cell.appendChild(label);
                cell.appendChild(input);
                container.appendChild(cell);
            }
        }

        function setNewWord() {
            var entry = getNextEntry();
            showEntry(entry);
        }

        function setPreviousWord() {
            var entry = getPreviousEntry();
            showEntry(entry);
        }

        function showEntry(entry) {
            if (!entry) {
                document.getElementById('wordDisplay').textContent = '—';
                document.getElementById('wordEn').textContent = '';
                document.getElementById('wordHi').textContent = '';
                var wfb = document.getElementById('wordForBox');
                if (wfb) wfb.textContent = '';
                buildInputs();
                return;
            }
            currentEntry = entry;
            currentWord = entry.de;
            document.getElementById('wordDisplay').textContent = currentWord;
            document.getElementById('wordEn').textContent = entry.en;
            document.getElementById('wordHi').textContent = entry.hi;
            buildInputs();
            updateWordForBox(1);
        }

        function parseWordsFromHtml(html) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var result = {};
            doc.querySelectorAll('.category').forEach(function(cat) {
                var id = cat.id;
                if (!id) return;
                var rows = cat.querySelectorAll('tbody tr');
                result[id] = [];
                rows.forEach(function(tr) {
                    var tds = tr.querySelectorAll('td');
                    if (tds.length < 4) return;
                    var de = (tds[1].textContent || '').trim().replace(/^[^\wäöüßÄÖÜ]+/i, '');
                    var en = (tds[2].textContent || '').trim();
                    var hi = (tds[3].textContent || '').trim();
                    if (de) result[id].push({ de: de, en: en, hi: hi });
                });
            });
            return result;
        }

        var categorySelectListener = function() {
            currentCategoryId = this.value;
            currentIndexByCategory[currentCategoryId] = 0;
            setNewWord();
        };
        function fillCategorySelect() {
            var sel = document.getElementById('categorySelect');
            if (!sel) return;
            sel.removeEventListener('change', categorySelectListener);
            sel.innerHTML = '';
            if (!wordsByCategory || typeof wordsByCategory !== 'object') wordsByCategory = FALLBACK_WORDS;
            var total = 0;
            Object.keys(wordsByCategory).forEach(function(id) {
                var arr = wordsByCategory[id];
                if (Array.isArray(arr)) total += arr.length;
            });
            var optAll = document.createElement('option');
            optAll.value = 'all';
            optAll.textContent = 'All categories (' + total + ')';
            sel.appendChild(optAll);
            CATEGORIES.forEach(function(c) {
                var arr = wordsByCategory[c.id];
                if (!arr || !arr.length) return;
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.label + ' (' + arr.length + ')';
                sel.appendChild(opt);
            });
            sel.addEventListener('change', categorySelectListener);
        }

        function loadWords() {
            if (window.EMBEDDED_WORDS && Object.keys(window.EMBEDDED_WORDS).length > 0) {
                wordsByCategory = window.EMBEDDED_WORDS;
                fillCategorySelect();
                currentCategoryId = 'all';
                currentIndexByCategory.all = 0;
                setNewWord();
                return;
            }
            fetch('writing-data.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    wordsByCategory = data;
                    if (Object.keys(wordsByCategory).length === 0) throw new Error('No words');
                    fillCategorySelect();
                    currentCategoryId = 'all';
                    currentIndexByCategory.all = 0;
                    setNewWord();
                })
                .catch(function() {
                    return fetch('a1-650.html').then(function(r) { return r.text(); }).then(function(html) {
                        wordsByCategory = parseWordsFromHtml(html);
                        if (Object.keys(wordsByCategory).length === 0) throw new Error('No words');
                        fillCategorySelect();
                        currentCategoryId = 'all';
                        setNewWord();
                    });
                })
                .catch(function() {
                    wordsByCategory = FALLBACK_WORDS || {};
                    fillCategorySelect();
                    currentCategoryId = Object.keys(wordsByCategory)[0] || 'all';
                    currentIndexByCategory[currentCategoryId] = 0;
                    setNewWord();
                });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }

        document.getElementById('hearBtn').addEventListener('click', function() { speakGerman(currentWord); });
        document.getElementById('prevBtn').addEventListener('click', setPreviousWord);
        document.getElementById('nextBtn').addEventListener('click', setNewWord);
        document.getElementById('wordForBox').addEventListener('click', function() { if (currentWord) speakGerman(currentWord); });

        if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function() {};
        loadWords();
    </script>
    <script src="../../js/theme.js"></script>
</body>
</html>
